[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsage_ai"
version = "1.0.0"
description = "AI-assisted Cisco lab troubleshooting helper with human review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.36",
  "python-dotenv>=1.0",
  "pydantic>=2.0",
  "requests>=2.31",
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[tool.setuptools]
packages = ["ai", "data", "database", "models", "rules", "services", "ui"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
